name: Video Bot - 50 Trade Demo Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-bot-50-trade-test
  cancel-in-progress: false

jobs:
  run-video-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install websocket-client
          pip install git+https://github.com/victalejo/iqoptionapi.git

      - name: Run Video Bot
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
        run: |
          python -u video_bot.py
