name: Momentum 10 - Continuous 50 Trade Blocks

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: momentum-10-demo-test
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Momentum 10
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Start next 50-trade block
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "50-trade block finished."
          echo "Starting the next Momentum 10 block..."
          gh workflow run zeta.yml --ref "${{ github.ref_name }}"
