name: ZETA V2.4 - 50 Trade Demo Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: zeta-v2-demo-test
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Stop normally before GitHub's hard runner limit.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ZETA V2.4
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Restart ZETA automatically
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting the next ZETA run..."
          gh workflow run zeta.yml --ref "${{ github.ref_name }}"
